name: Actualizar datos y publicar

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub lo relanza cuando puede; el job dura ~5,5h y se encadena
  workflow_dispatch:

concurrency:
  group: exporter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # el job vive ~5,5h y refresca en bucle; el schedule lo re-lanza
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persistencia entre ejecuciones: BD (historial + timestamps de niveles), token y fotos.
      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: |
            fantasy.db
            .token.json
            web/img
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            state-

      - name: Reconstruir credenciales desde secretos
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          LALIGA_TOKEN_JSON: ${{ secrets.LALIGA_TOKEN_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          if [ ! -s .token.json ]; then printf '%s' "$LALIGA_TOKEN_JSON" > .token.json; fi
          chmod 600 config.json .token.json

      - name: Dependencias
        run: |
          pip install --quiet -r exporter/requirements.txt
          npm install -g wrangler@latest >/dev/null 2>&1 || true

      # Bucle continuo: cada ~9 min actualiza los datos y PUBLICA (siempre, para que la marca
      # "Actualizado" avance de verdad). Los deploys van espaciados (no en ráfaga), así el login
      # no parpadea. Los niveles del exportador evitan machacar las fuentes.
      - name: Bucle continuo (actualiza + publica cada ~9 min)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          END=$(( $(date +%s) + 330*60 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1)); echo "::group::ciclo $i · $(date -u +%H:%M) UTC"
            python -m exporter.run || echo "exportador falló en este ciclo (continúo)"
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              wrangler pages deploy --project-name matelekinhos-fantasy --branch main --commit-dirty=true \
                || echo "deploy falló en este ciclo (continúo)"
            else
              echo "Falta CLOUDFLARE_API_TOKEN: salto el deploy."
            fi
            echo "::endgroup::"
            [ "$(date +%s)" -lt "$END" ] && sleep 540 || true
          done
          echo "bucle terminado; el schedule lo relanzará."
